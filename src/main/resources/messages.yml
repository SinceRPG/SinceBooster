# =====================================================
#               MESSAGES & GUI CONFIG
# =====================================================
# Supports Color codes & (Legacy) and MiniMessage (<green>, <gradient:red:blue>)

prefix: "&8[&bSinceBooster&8] &r"

admin:
  reload: "&aConfiguration reloaded successfully!"
  view_title: "&8Boosters: &2<target>"
  invalid_player: "&cAn error occurred: Player does not exist or is offline."
  set_rate_global: "&aSet Global &e<type> &ato &6<value>"
  set_rate_player: "&aSet &b<target>'s &e<type> &ato &6<value>"
  remove_success: "&aRemoved Booster &e<id> &afrom player &b<target>&a."
  remove_all_success: "&aRemoved &call &aboosters from player &b<target>&a."

share:
  invalid_target: "&cInvalid target."
  self_interaction: "&cYou cannot perform this action on yourself."
  no_boosters_to_share: "&cYou do not have any active boosters available to share."
  invite_sent: "&aSent a share invite for &e<booster_display> &ato &b<target>&a. Expires in <time>s."
  invite_received: "&b<player> &awants to share &e<booster_display> &awith you. Type &6/booster accept <player> &ato accept."

  # Messages when using /booster share <name> all
  invite_batch_sent: "&aSent batch share invites for &e<list> &ato &b<target>&a."
  invite_batch_received: "&b<player> &awants to share &e<list> &awith you. Type &6/booster accept <player> &ato accept."
  batch_separator: "&7, &e"

  booster_not_found: "&cCould not find Booster with ID: &e<id>"
  invalid_sender: "&cInvalid sender."
  sender_offline_or_invalid: "&cThe sender of the invite is no longer online."
  no_invite: "&cYou have no pending invites from this player or the invite has expired."

  accepted_sender: "&b<target> &ahas accepted your booster share!"
  accepted_receiver: "&aYou have successfully started sharing a booster with &b<player>&a!"
  limit_reached: "&cError: Share limit reached (<current>/<max>)."

  kick_success: "&aStopped sharing &e<booster> &awith &c<target>&a."
  kick_target_notify: "&c<player> &cstopped sharing &e<booster> &cwith you."
  unknown_player: "&cUnknown"

  owner_offline: "&cThe owner of this booster is currently offline."
  leave_success: "&aSuccessfully cancelled shared boosters from &b<owner>&a."
  leave_owner_notify: "&e<player> &aopted to leave your shared booster."
  not_sharing_with_owner: "&cYou are not sharing any boosters with this player."
  no_permission: "&cYou do not have permission to use the share feature (sincebooster.share)."
  offline_share_active: "&7(Offline Share: &aEnabled&7)"
  offline_share_inactive: "&7(Offline Share: &cDisabled&7)"
  offline_toggle_on: "&aSuccessfully &2ENABLED &aoffline sharing."
  offline_toggle_off: "&cSuccessfully &4DISABLED &coffline sharing."
  offline_no_perm: "&cYou do not have permission to toggle offline sharing (sincebooster.share.offline)."

booster:
  receive:
    extend: "&aBooster &e<id> &ahas been extended by &b<time> seconds&a!"
    permanent: "&aYou received a Permanent Booster: &e<id> &7(x<multiplier>)&a!"
    duration: "&aYou received a Booster: &e<id> &7(x<multiplier> for <time>s)&a!"
  expired: "&cYour booster &e<id> &chas expired!"

  gui:
    title: "&0Boosters List"
    action_cooldown: "&c&lPlease slow down your actions!"
    closed_on_reload: "&cMenu closed due to server reload."

    formats:
      time_left: "&f<day>d <hour>h <min>m <sec>s"

    share_button:
      name: "&e&lShare Booster"
      material: "OAK_SIGN"
      slot: 49
      lore:
        - "&7Click to select a player"
        - "&7and share booster benefits."
        - ""
        - "&bClick to open menu!"

    offline_toggle_button:
      slot: 50
      enabled:
        name: "&aOffline Share: &2ON"
        material: "LIME_DYE"
        lore:
          - "&7Boosters will remain active for"
          - "&7shared receivers when you log off."
          - ""
          - "&eClick to DISABLE this feature."
      disabled:
        name: "&cOffline Share: &4OFF"
        material: "GRAY_DYE"
        lore:
          - "&7Boosters will deactivate for"
          - "&7shared receivers when you log off."
          - ""
          - "&eClick to ENABLE this feature."
      no_perm:
        name: "&7Offline Share: &cLocked"
        material: "BARRIER"
        lore:
          - "&7You do not have permission"
          - "&7to share offline."
          - ""
          - "&cRequirement: sincebooster.share.offline"

    item:
      own:
        name_time: "&6<id> &7(Left: <time>)"
        name_perm: "&d&lPERM: &6<id> &7(Permanent)"
        lore:
          - "&7Type: <type_color><type_name>"
          - "&7Multiplier: &e+<percent>%"
          - ""
          - "&7Status: <status>"
          - "&7Sharing with: &f<shared_count> players"
          - "&7Decay Rate: &c<decay_rate>x/s"
          - "&7Personal Efficiency: &a<efficiency>%"
          - ""
          - "&fShared With:"
          - "<shared_list>"
          - ""
          - "&eClick &7to manage shares."

      received:
        name_time: "&bShared: &f<id> &7(<time>)"
        name_perm: "&bShared: &dPERM &f<id>"
        lore:
          - "&7Owner: &f<owner_name>"
          - "&7Type: <type_color><type_name>"
          - "&7Base Multiplier: &e+<base_multiplier>x"
          - ""
          - "&7Receiver Efficiency: &b<efficiency>%"
          - "&7Actual Multiplier: &a+<real_multiplier>x"
          - ""
          - "&7Status: <status>"
          - ""
          - "&cShift + Click &7to cancel share."

      status_perm: "&aActive"
      status_time: "&eExpires in: &f<time_left>"
      shared_list_none: "&7- (None)"
      shared_list_format: "&7- &f<player>"

    summary_class:
      material: "EXPERIENCE_BOTTLE"
      name: "&aClass XP Summary"
      lore:
        - "&7Total Multiplier: &e<total_multiplier>x &7(+<total_percent>%)"
        - ""
        - "&fDetails:"
        - "&7- Owned: &a+<own_percent>%"
        - "&7- Shared: &b+<shared_percent>%"

    summary_prof:
      material: "WRITABLE_BOOK"
      name: "&6Profession XP Summary"
      prof_format: "&7- <profession>: &e<multiplier>x &7(+<percent>%)"
      prof_none: "&7No active profession boosters."
      lore:
        - "&7Applied Multipliers:"
        - ""
        - "<prof_list>"

    separator:
      material: "BLACK_STAINED_GLASS_PANE"

    empty_slot:
      name: "&cEmpty Slot"
      lore:
        - "&7Acquire more boosters to fill this up!"

share_gui:
  player_selector:
    title: "&0Select Receiver"
    item_name: "&e<player_name>"
    lore:
      - "&7Click to select this player"
      - "&7as a share target."

  booster_selector:
    title: "&0Select Booster to Share"
    item:
      name_time: "&6<id> &7(<time>)"
      name_perm: "&d<id> &7(Permanent)"
      status_full: "&cFull (<current>/<max>)"
      status_available: "&aAvailable (<current>/<max>)"
      lore:
        - "&7Type: <type_color><type_name>"
        - "&7Multiplier: &e<multiplier>x &7(+<percent>%)"
        - ""
        - "&7Receiver will get: &b<rec_multiplier>x &7(+<rec_percent>%)"
        - "&7Slots: <slot_color><status_text>"
        - ""
        - "&eClick to send invite!"

  back_button:
    material: "ARROW"
    name: "&cBack"

manage_share_gui:
  title: "&0Manage Shares"
  item_name: "&cKick: &f<player>"
  lore:
    - "&7Click to kick this player"
    - "&7from receiving the booster."

  empty:
    name: "&cNot Sharing"
    lore:
      - "&7This booster is not currently"
      - "&7being shared with anyone."

log:
  hook_mmocore_success: "Hooked into MMOCore successfully!"
  hook_mmocore_fail: "MMOCore not found! Exp multipliers will not work."
  saving_data: "Saving player data..."
  db_create_fail: "Could not create database tables!"
  db_save_error: "Error saving data for <uuid> - Transaction rolled back!"
  temp_load_boosters: "Temporarily loaded <count> boosters for <uuid> to process offline sharing."