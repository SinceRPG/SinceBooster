# =====================================================
#             SINCE BOOSTER CONFIGURATION
# =====================================================

database:
  # Loại cơ sở dữ liệu: "SQLITE" (lưu vào file .db) hoặc "MYSQL" (kết nối máy chủ dữ liệu)
  type: "SQLITE"
  host: "localhost"
  port: "3306"
  database: "minecraft"
  username: "root"
  password: ""
  # Tên các bảng trong database (nên để mặc định)
  table_users: "sincebooster_users"
  table_boosters: "sincebooster_boosters"

share:
  # Tỷ lệ hao mòn thời gian khi đang chia sẻ Booster cho người khác.
  # Ví dụ: 2.0 nghĩa là Booster sẽ hết hạn nhanh gấp đôi khi có người dùng chung.
  default-rate: 2.0

  # Hiệu suất của CHỦ SỞ HỮU khi chia sẻ cho người khác (0.75 = 75%).
  # Ví dụ: Booster x10 (Bonus +9), bạn sẽ nhận được: 1 + (9 * 0.75) = 7.75x
  default-owner-buff: 0.75

  # Hiệu suất của NGƯỜI NHẬN khi chủ sở hữu đang ONLINE (0.5 = 50%).
  # Ví dụ: Booster x10 (Bonus +9), người nhận được: 1 + (9 * 0.5) = 5.5x
  default-receiver-buff: 0.5

  # Số người tối đa mà một người chơi có thể chia sẻ Booster cùng lúc.
  default-share-limit: 1

  offline:
    # Cho phép Booster tiếp tục hoạt động cho người nhận ngay cả khi chủ sở hữu thoát game.
    enabled: true
    # Hiệu suất của NGƯỜI NHẬN khi chủ sở hữu đang OFFLINE (0.25 = 25%).
    # Ví dụ: Booster x10 (Bonus +9), người nhận được: 1 + (9 * 0.25) = 3.25x
    default-offline-rate: 0.25

# Thời gian tự động lưu dữ liệu từ RAM vào Database (tính bằng giây).
# 300 giây = 5 phút lưu 1 lần để tránh mất dữ liệu khi crash.
auto-save: 300