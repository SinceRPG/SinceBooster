# =====================================================
#             SINCE BOOSTER CONFIGURATION
# =====================================================

database:
  # Database type: "SQLITE" (saved to a .db file) or "MYSQL" (remote database server)
  type: "SQLITE"
  host: "localhost"
  port: "3306"
  database: "minecraft"
  username: "root"
  password: ""
  # Names of the tables in the database (recommend leaving default)
  table_users: "sincebooster_users"
  table_boosters: "sincebooster_boosters"

gui:
  # Use "INVENTORY" for the traditional Minecraft Chest UI.
  # Use "DIALOG" for the modern Minecraft 1.21.6+ Custom Dialog menus.
  type: "INVENTORY"

share:
  # Seconds before a pending share invite expires.
  invite-expiry-seconds: 60

  # Decay rate of time when sharing a Booster with other players.
  # Example: 2.0 means the Booster will expire twice as fast when shared.
  default-rate: 2.0

  # Efficiency for the OWNER when sharing with others (0.75 = 75%).
  # Example: Booster x10 (Bonus +9), you will receive: 1 + (9 * 0.75) = 7.75x
  default-owner-buff: 0.75

  # Efficiency for the RECEIVER when the owner is ONLINE (0.5 = 50%).
  # Example: Booster x10 (Bonus +9), the receiver gets: 1 + (9 * 0.5) = 5.5x
  default-receiver-buff: 0.5

  # Maximum number of players a single player can share a Booster with concurrently.
  default-share-limit: 1

  offline:
    # Allows the Booster to continue working for receivers even when the owner disconnects.
    enabled: true
    # Efficiency for the RECEIVER when the owner is OFFLINE (0.25 = 25%).
    # Example: Booster x10 (Bonus +9), the receiver gets: 1 + (9 * 0.25) = 3.25x
    default-offline-rate: 0.25

# Time interval (in seconds) to auto-save RAM data to the Database.
# 300 seconds = 5 minutes per save to prevent data loss upon crash.
auto-save: 300
